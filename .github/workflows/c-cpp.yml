name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -f .github/docker/Dockerfile -t mandelbrot-build-env:latest .

    - name: Build inside Docker
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace mandelbrot-build-env:latest make

    - name: Test inside Docker
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace mandelbrot-build-env:latest make test

    - name: Build debian package inside Docker
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace mandelbrot-build-env:latest make deb