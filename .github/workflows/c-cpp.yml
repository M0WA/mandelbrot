name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Download build-env image
      id: download-sha
      uses: actions/download-artifact@v4
      with:
        name: build-env-image-${{ github.sha }}
        path: .
      continue-on-error: true

    - name: Download latest image artifact (fallback)
      if: steps.download-sha.outcome != 'success'
      uses: actions/download-artifact@v4
      with:
        name: build-env-image-latest
        path: .

    - name: Load Docker image
      run: |
        if [ -f image.tar ]; then
          docker load -i image.tar
        elif [ -f image-latest.tar ]; then
          docker load -i image-latest.tar
        else
          echo "No Docker image artifact found (searched for image.tar and image-latest.tar)" >&2
          exit 1
        fi

    - name: Build inside Docker
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace mandelbrot-build-env:latest bash -lc "make"
